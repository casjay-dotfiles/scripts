# screen-new master template
#
# PREFIX = Ctrl+n (tmux-compatible bindings)
# PREFIX PREFIX sends literal prefix key to the application
# Process exit: press k to kill window, r to restart
#
# Placeholders replaced by screen-new at session-config creation time:
#   SCREEN_NEW_CONF_FILE_MAIN     - absolute path to this generated conf file
#   SCREEN_NEW_CONF_FILE_WINDOWS  - absolute path to the generated windows file
#   SCREEN_NEW_CONF_FILE_LOCAL    - absolute path to the per-session local override
#   SCREEN_NEW_CONF_BUFFERFILE    - absolute path to the clipboard exchange buffer

# Escape / prefix key (default: Ctrl+n, PREFIX PREFIX sends literal)
escape ^N^N

# Display
hardstatus alwayslastline
hardstatus string '%{= kb}[%{= kw}%H%{= kb}] %{= kw}%1`%{= kb}| %{= kw}%2`%{= kb}| %{= kw}%3`%{= kb}| %{= kw}%-w%{= kW}%n %t%{= kb}%+w %= %{= kw}%c'
caption splitonly
startup_message off

# Keep window open on error exit only (k=kill, r=restart)
zombie kr onerror

# Use alternate screen buffer (for curses apps like htop, vim)
altscreen on

# Color and emoji support
term xterm-256color
defutf8 on
utf8 on on
truecolor on
defencoding UTF-8
encoding UTF-8

# Mouse scrollback support
termcapinfo xterm* ti@:te@
mousetrack off
defscrollback 10000

# SIGWINCH / terminal resize support
termcapinfo xterm* 'is=\E[r\E[m\E[2J\E[H\E[?7h\E[?1;4;6l'
termcapinfo xterm* OL=10000
defnonblock on
nonblock on

# Buffer file used by Y (copy to system clipboard)
bufferfile SCREEN_NEW_CONF_BUFFERFILE

# Backtick data sources for hardstatus (git/weather/uptime), refreshed every 15s
backtick 1 15 15 screen-new --exec git
backtick 2 60 60 screen-new --exec weather
backtick 3 15 15 screen-new --exec uptime

# Window management (tmux-compatible)
bind t screen ${SHELL:-bash} -l
bind c screen ${SHELL:-bash} -l
bind n next
bind p prev
bind , title
bind w windowlist -b
bind @ kill

# Split management (tmux-compatible)
bind \\ split -v
bind / split
bind x remove
bind Q only

# Pane/region resize (tmux-compatible: h/j/k/l)
bind h resize -5
bind j resize +5
bind k resize -5
bind l resize +5

# Pane/region focus navigation (PREFIX + arrow keys, no conflict with h/j/k/l resize)
bind -k kl focus left
bind -k kr focus right
bind -k ku focus up
bind -k kd focus down

# Send literal prefix key through with the backtick key (PREFIX `)
bind ` other

# Zoom current region to full size (degraded - no toggle back, use PREFIX Q to restore layout)
bind + only

# Copy mode
bind [ copy
bind ] paste .

# Copy screen's copy-buffer out to the system clipboard (Wayland/X11/macOS)
bind Y eval 'writebuf SCREEN_NEW_CONF_BUFFERFILE' 'exec !!! bash -c "wl-copy < SCREEN_NEW_CONF_BUFFERFILE 2>/dev/null || xclip -selection clipboard < SCREEN_NEW_CONF_BUFFERFILE 2>/dev/null || pbcopy < SCREEN_NEW_CONF_BUFFERFILE 2>/dev/null"'

# Paste from the system clipboard into the current window (Wayland/X11/macOS)
bind ^V exec !!! bash -c "wl-paste 2>/dev/null || xclip -o -selection clipboard 2>/dev/null || pbpaste 2>/dev/null"

# Mouse on/off toggle pair
bind m mousetrack on
bind M mousetrack off

# Reload this session's config live (re-sources this generated file)
bind R source SCREEN_NEW_CONF_FILE_MAIN

# Interactive window list (Tab) - like tmux choose-tree
bind ^I windowlist

# Shift+arrow without prefix
bindkey "\033[1;2D" prev
bindkey "\033[1;2C" next

# Show keybindings with PREFIX ?
bind ? exec !!! bash -c 'less "$HOME/.config/myscripts/screen-new/keybindings.txt"'

# Generated per-session windows
source SCREEN_NEW_CONF_FILE_WINDOWS

# Per-session local overrides (always present, empty by default)
source SCREEN_NEW_CONF_FILE_LOCAL
