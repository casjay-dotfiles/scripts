# screen-new minimal template
#
# PREFIX = Ctrl+n
# Minimal keybindings only - no backtick status widgets, no clipboard binds
#
# Placeholders replaced by screen-new at session-config creation time:
#   SCREEN_NEW_CONF_FILE_MAIN     - absolute path to this generated conf file
#   SCREEN_NEW_CONF_FILE_WINDOWS  - absolute path to the generated windows file
#   SCREEN_NEW_CONF_FILE_LOCAL    - absolute path to the per-session local override

escape ^N^N

hardstatus alwayslastline
hardstatus string '%{= kb}[%{= kw}%H%{= kb}] %{= kw}%-w%{= kW}%n %t%{= kb}%+w %= %{= kw}%c'
caption splitonly
startup_message off
zombie kr onerror
altscreen on
term xterm-256color
defutf8 on
utf8 on on
defencoding UTF-8
encoding UTF-8
termcapinfo xterm* ti@:te@
mousetrack off
defscrollback 10000

bind t screen ${SHELL:-bash} -l
bind c screen ${SHELL:-bash} -l
bind n next
bind p prev
bind , title
bind w windowlist -b
bind @ kill
bind \\ split -v
bind / split
bind x remove
bind Q only
bind h resize -5
bind j resize +5
bind k resize -5
bind l resize +5
bind [ copy
bind ] paste .
bind ^I windowlist
bindkey "\033[1;2D" prev
bindkey "\033[1;2C" next

source SCREEN_NEW_CONF_FILE_WINDOWS
source SCREEN_NEW_CONF_FILE_LOCAL
