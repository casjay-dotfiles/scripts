// Zellij bootstrap configuration for zellij-new (KDL format)
// Copied to $ZELLIJ_CONFIG_DIR/zellij.conf on first run of bin/zellij-new,
// before any per-session template.kdl exists. Content matches new.conf -
// keep both in sync when either changes.
// Ground truth verified on-host against zellij 0.44.3 via:
//   zellij setup --dump-config / zellij action --help / zellij options --help
// Ported from templates/tmux/new.conf's actual keybindings where a native
// zellij action exists. Anything with no native equivalent is documented
// below rather than invented. See `zellij-new --exec keybindings` for the
// full reference and gap list shown to the user.
//
// Gaps confirmed NOT to exist in zellij 0.44.3 (verified via `zellij action
// --help` and `zellij setup --dump-config` - no KDL action or CLI action
// subcommand covers these):
//   - broadcast a command to every pane at once (tmux-new's prefix+Ctrl-p)
//   - display an in-app keybindings help popup running an external command
//     (no Run/RunCommand-style KDL keybind action exists; `?` is unbound -
//     use `zellij-new --exec keybindings` from another terminal instead)
//   - prompt-for-name + create a brand new session from inside a running
//     session (tmux-new's prefix+N); `N` launches the session-manager
//     plugin instead, the closest built-in equivalent
//   - reload a single session's config file live (tmux-new's prefix+R);
//     zellij only reloads config on next launch
//   - relocate all windows/tabs of the current session into another
//     session (tmux-new's prefix+r)
//   - true reverse-of-break "join pane into this tab" (BreakPane exists,
//     there is no JoinPane); `B` below breaks one pane at a time instead
//     of tmux-new's "break all panes in the window" in a single keypress
//   - live runtime toggle of mouse_mode (it is a static config option, not
//     an action); set `mouse_mode` below and reload instead

theme "dracula"

simplified_ui false
pane_frames true
mouse_mode true
scroll_buffer_size 10000
copy_on_select true
default_shell "bash"
default_mode "normal"

// Native session persistence (replaces the old custom state.txt/lock
// mechanism entirely)
session_serialization true
serialize_pane_viewport true
scrollback_lines_to_serialize 10000

// Copy command - resolved from a runtime OS/tool detection placeholder by
// bin/zellij-new (mirrors templates/tmux/new.conf's xclip/wl-copy/pbcopy
// if-shell detection); OSC-52 remains the fallback when unset
copy_command "ZELLIJ_NEW_COPY_COMMAND"
copy_clipboard "system"

keybinds {
    // Rebind the tmux-emulation prefix from the zellij default (Ctrl b) to
    // Ctrl-Space, matching templates/tmux/new.conf's `set-option -g prefix
    // C-Space`
    shared_except "tmux" "locked" {
        unbind "Ctrl b"
        bind "Ctrl Space" { SwitchToMode "Tmux"; }
    }

    // Unprefixed window navigation (tmux-new's `bind -n S-Left/S-Right`)
    normal {
        bind "Shift Left" { GoToPreviousTab; }
        bind "Shift Right" { GoToNextTab; }
    }

    // Prefix table (entered via Ctrl-Space) - overrides/additions on top
    // of zellij's built-in tmux mode, mirrored from templates/tmux/new.conf
    tmux {
        // double-tap Ctrl-Space passes a literal NUL through to a nested
        // session, mirroring tmux-new's `bind-key Space send-prefix`
        bind "Ctrl Space" { Write 0; SwitchToMode "Normal"; }

        // window/tab select by number
        bind "1" { GoToTab 1; SwitchToMode "Normal"; }
        bind "2" { GoToTab 2; SwitchToMode "Normal"; }
        bind "3" { GoToTab 3; SwitchToMode "Normal"; }
        bind "4" { GoToTab 4; SwitchToMode "Normal"; }
        bind "5" { GoToTab 5; SwitchToMode "Normal"; }
        bind "6" { GoToTab 6; SwitchToMode "Normal"; }
        bind "7" { GoToTab 7; SwitchToMode "Normal"; }
        bind "8" { GoToTab 8; SwitchToMode "Normal"; }
        bind "9" { GoToTab 9; SwitchToMode "Normal"; }

        // last-active-tab jump (tmux-new's `` ` `` -> last-window)
        bind "`" { ToggleTab; SwitchToMode "Normal"; }

        // < / > previous/next window
        bind "<" { GoToPreviousTab; SwitchToMode "Normal"; }
        bind ">" { GoToNextTab; SwitchToMode "Normal"; }

        // move (reorder) current tab
        bind "Shift Left" { MoveTab "Left"; SwitchToMode "Normal"; }
        bind "Shift Right" { MoveTab "Right"; SwitchToMode "Normal"; }

        // window splitting, retaining cwd (zellij inherits the focused
        // pane's cwd on NewPane by default)
        bind "\\" { NewPane "Right"; SwitchToMode "Normal"; }
        bind "/" { NewPane "Down"; SwitchToMode "Normal"; }

        // resize (repeatable in tmux-new via -r; zellij's Resize mode is
        // itself repeatable while held)
        bind "h" { Resize "Increase Left"; SwitchToMode "Normal"; }
        bind "j" { Resize "Increase Down"; SwitchToMode "Normal"; }
        bind "k" { Resize "Increase Up"; SwitchToMode "Normal"; }
        bind "l" { Resize "Increase Right"; SwitchToMode "Normal"; }
        bind "Ctrl Left" { Resize "Decrease Left"; SwitchToMode "Normal"; }
        bind "Ctrl Right" { Resize "Decrease Right"; SwitchToMode "Normal"; }
        bind "Ctrl Up" { Resize "Decrease Up"; SwitchToMode "Normal"; }
        bind "Ctrl Down" { Resize "Decrease Down"; SwitchToMode "Normal"; }

        // close tab / zoom / sync / swap-layout picker
        bind "@" { CloseTab; SwitchToMode "Normal"; }
        bind "+" { ToggleFocusFullscreen; SwitchToMode "Normal"; }
        bind "s" { ToggleActiveSyncTab; SwitchToMode "Normal"; }
        bind "w" { NextSwapLayout; SwitchToMode "Normal"; }

        // session picker/tree (closest native equivalent to tmux-new's
        // Tab/BTab choose-tree bindings)
        bind "Tab" {
            LaunchOrFocusPlugin "session-manager" {
                floating true
                move_to_focused_tab true
            }
            SwitchToMode "Normal"
        }

        // new session (closest native equivalent to tmux-new's prefix+N
        // command-prompt; see gap note above)
        bind "N" {
            LaunchOrFocusPlugin "session-manager" {
                floating true
                move_to_focused_tab true
            }
            SwitchToMode "Normal"
        }

        // break focused pane out into its own tab (tmux-new's prefix+B;
        // see gap note above re: "break all")
        bind "B" { BreakPane; SwitchToMode "Normal"; }
    }
}

ui {
    pane_frames {
        rounded_corners true
        hide_session_name false
    }
}

env {
    ZELLIJ_AUTO_ATTACH "true"
    ZELLIJ_AUTO_EXIT "true"
}

themes {
    dracula {
        fg "#f8f8f2"
        bg "#282a36"
        black "#21222c"
        red "#ff5555"
        green "#50fa7b"
        yellow "#f1fa8c"
        blue "#bd93f9"
        magenta "#ff79c6"
        cyan "#8be9fd"
        white "#f8f8f2"
        orange "#ffb86c"
    }
}
