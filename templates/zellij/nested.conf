// Zellij nested-session configuration for zellij-new (KDL format)
// Used by `zellij-new nested [name]` - a lightweight config for a zellij
// session meant to run INSIDE another zellij session (or a terminal that
// may later be wrapped in one). Deliberately does NOT rebind the mode-entry
// key away from the zellij default (Ctrl b), so it never collides with an
// outer session using new.conf's Ctrl-Space rebind. Status bar is kept
// minimal (simplified_ui) so nested/outer sessions are visually distinct.
//
// Ground truth verified on-host against zellij 0.44.3 via:
//   zellij --help (top-level -c/--config) / zellij attach --help (-c/--create)
// `zellij -c nested.conf attach -c <name>` creates the session if it does
// not exist yet and attaches either way - this is the real CLI syntax
// (there is no tmux-style `new-session -d`/`send-keys`/`switch-client` in
// zellij; those do not exist).

theme "dracula"

simplified_ui true
pane_frames true
mouse_mode true
scroll_buffer_size 10000
copy_on_select true
default_shell "bash"
default_mode "normal"

session_serialization true
serialize_pane_viewport true
scrollback_lines_to_serialize 10000

copy_command "ZELLIJ_NEW_COPY_COMMAND"
copy_clipboard "system"

ui {
    pane_frames {
        rounded_corners true
        hide_session_name false
    }
}

themes {
    dracula {
        fg "#f8f8f2"
        bg "#282a36"
        black "#21222c"
        red "#ff5555"
        green "#50fa7b"
        yellow "#f1fa8c"
        blue "#bd93f9"
        magenta "#ff79c6"
        cyan "#8be9fd"
        white "#f8f8f2"
        orange "#ffb86c"
    }
}
