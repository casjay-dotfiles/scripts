// Zellij minimal configuration for zellij-new (KDL format)
// No plugin/session-manager panes, no prefix-mode keybind overrides -
// just options, theme and native defaults. Used for the `single`/`shell`
// style presets where a full tmux-emulation keybind layer is not wanted.

theme "dracula"

simplified_ui true
pane_frames false
mouse_mode true
scroll_buffer_size 10000
copy_on_select true
default_shell "bash"
default_mode "normal"

session_serialization true
serialize_pane_viewport true
scrollback_lines_to_serialize 10000

copy_command "ZELLIJ_NEW_COPY_COMMAND"
copy_clipboard "system"

themes {
    dracula {
        fg "#f8f8f2"
        bg "#282a36"
        black "#21222c"
        red "#ff5555"
        green "#50fa7b"
        yellow "#f1fa8c"
        blue "#bd93f9"
        magenta "#ff79c6"
        cyan "#8be9fd"
        white "#f8f8f2"
        orange "#ffb86c"
    }
}
